name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: node src/index.js lint-skills
      - name: schema + worker queries run on a real Postgres (PGlite)
        run: npm run schema:check
      - name: config files parse
        run: node -e "require('fs').readdirSync('config').filter(f=>f.endsWith('.json')).forEach(f=>JSON.parse(require('fs').readFileSync('config/'+f)))"
